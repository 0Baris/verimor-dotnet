name: Publish to NuGet

# Manual: pushes the package attached to an existing GitHub Release, unchanged.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.1.0
        required: true

permissions:
  contents: read

jobs:
  nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag must look like v1.2.3" >&2; exit 1 ;;
          esac
          package="BarisCemant.Verimor.${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern "$package.nupkg" --pattern "$package.snupkg"
          # The .snupkg next to the .nupkg is pushed to the symbol server automatically.
          dotnet nuget push "release/$package.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
